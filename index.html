<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivo - Skill Sprint</title>
    <link rel="icon" href="../assets/favicon-32x32.png" type="image/x-icon" /> <!-- Adiciona o favicon -->
    <style>
        /* Define que html e body ocuparão 100% da largura e altura da tela,
           removendo margens e paddings padrão */
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: black;
        }

        /* Faz com que o elemento <object> ocupe toda a tela sem bordas */
        object {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <!-- Incorpora outro arquivo HTML (src/index.html) dentro desta página.
         Esse conteúdo aparecerá ocupando toda a tela -->
    <object type="text/html" data="src/index.html"></object>

</body>

</html>
